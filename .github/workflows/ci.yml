name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  host-e2e:
    name: Host E2E (${{ matrix.host }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pin hosts to revisions with passing offline builds; upstream main is currently
        # red in its own Google FinishReason switch before plugin tests can start.
        include:
          - host: xz-dev/pi
            sha: e88a9b4b9a26d73042defa261ab486d7c4e15093
            script: test:e2e:xz-dev-pi
          - host: earendil-works/pi
            sha: b2602be77cb7b0de45dd616407fd210daa48aa75
            script: test:e2e:upstream-pi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pi-continuity-e2e/hosts
          key: pi-continuity-e2e-${{ runner.os }}-${{ runner.arch }}-node22-recipe4-${{ matrix.host }}-${{ matrix.sha }}
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          E2E_HOST_SHA: ${{ matrix.sha }}
          E2E_HOST_CACHE_RECIPE: "4"
